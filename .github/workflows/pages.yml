name: Pages

# Builds the demo on every push to main: runs the mock StreamFlix sign-up flow
# against the fair and the unfair cancel flow (`npm run demo`, which exits 1
# unless the fair pair holds and the unfair one fails), then publishes site/
# with both reports to GitHub Pages. The page's <meta name="build"> carries the
# commit it was built from.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run demo
      - name: Stamp the build
        run: |
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/" site/index.html
          grep -q "<meta name=\"build\" content=\"${GITHUB_SHA}\">" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
