<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamFlix: tell us why</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <span class="logo">StreamFlix</span>
    <span class="mock">A mock site for the cancel-parity demo. Nothing here is real.</span>
    <a href="../../index.html">Back to the demo</a>
  </header>
  <main>
    <h1>Tell us why you are leaving</h1>
    <p>We'll miss you, and you'll lose your watch history.</p>
    <p>Prefer to talk it over? Call our retention team on 1-800-555-0100.</p>
    <form method="get" action="confirm.html">
      <label>Reason <textarea name="reason"></textarea></label>
      <label class="check"><input type="checkbox" name="pause" checked> Keep my plan and pause billing for a month</label>
      <button type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
